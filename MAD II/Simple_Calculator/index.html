<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script>
        function calculate(){
            expression = document.getElementById("expression").value;
            console.log(expression);
            if (expression) {
                try {
                    answer = eval(expression)
                    document.getElementById("expression").value =  answer;
                } catch(e) {
                    console.log("Bad Expression")
                }
            }
        }
    </script>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col">
            
            </div>
            <div class="col">
                <input type="input" class="form-control" id="expression" placeholder="3*5" >
                <button id="calculate" onclick="calculate()" class="btn btn-primary">Calculate</button>
            </div>
            <div class="col">
            
            </div>
        </div>
    </div>
    
</body>
</html>
