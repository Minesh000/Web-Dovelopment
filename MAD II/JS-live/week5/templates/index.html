<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="app" class="container mt-4">
        <h2>My Notes {{ name }}</h2>
        <div v-for="note in notes" class="card mt-3">
            <div class="card-body">
                <h5>{{ note.title }}</h5>
                <p>{{ note.content }}</p>
                <p>ID: {{note.id}}</p>
            </div>
        </div>
    </div>
    

    <script>
        new Vue({
            el: '#app',
            data: {
                name: "Jhone Doe",
                notes: []
            },
            methods: {
                fetchNotes: function () {
                    fetch("http://127.0.0.1:5000/api/data")
                    .then((response) => response.json())
                    .then((data) => {
                        this.notes = data;
                        console.log("Fetched notes:", this.notes);
                    })
                },
                addNotes: function () {
                    fetch("http://127.0.0.1:5000/api/data", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            id: 3,
                            title: "New Note",
                            content: "This is a new note.",
                        })
                    }
                    ).then((response) => response.json())
                    .then((data) => {
                        console.log("Added note:", data);
                        this.fetchNotes();
                        }
                    )

                }  
            },

            mounted: function () {
                this.fetchNotes()
                this.addNotes()
            }
 
        })
    </script>
</body>
</html>
